[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ofrom_outils"
version = "0.0.2"
description = "Collection d'outils pour la gestion du corpus OFROM+."
authors = [
    {name = "François Delafontaine", email = "francois_delafontaine@outlook.com"}
]
readme = "README.md"
requires-python = ">= 3.10"
license = "GPL-3.0-or-later"
classifiers = [
    "Development Status :: 1 - Planning",
	"Intended Audience :: Science/Research",
	"Operating System :: Microsoft :: Windows",
	"Natural Language :: Français",
    "Programming Language :: Python :: 3",
	"Topic :: Scientific/Engineering",
]
dependencies = [
	'openpyxl >= 3.1.5',
	'corflow >= 3.4.3',
	'paramiko >= 4.0',
	'requests >= 2.32.5',
	'numpy >= 2.4.2',
	'scipy >= 1.17',
	'scikit-learn >= 1.8',
	'sklearn-crfsuite >= 0.5',
	'joblib >= 1.5.3',
]

[project.urls]
Repository = "https://github.com/Delafontainef/ofrom_outils"

[tool.setuptools]
packages = ["ofrom_outils"]