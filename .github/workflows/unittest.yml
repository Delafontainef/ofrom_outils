name: Unittest

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch the repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ">=3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: Run unittest
        run: |
          python xvfb-run -m unittest discover -s ofrom_outils -p "test_*.py"
