name: Ruff

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Fetch the repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ">=3.12"
    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Run ruff
      if: ${{ !cancelled() }}
      run: ruff check
    - name: Check result
      if: ${{ !cancelled() }}
      run: ruff format --diff
