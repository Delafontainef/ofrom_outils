name: Ruff

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Fetch the repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ">=3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ruff
        pip install .
    - name: Run ruff
      run: ruff check --target-version py312
    - name: Run unittest
      if: ${{ !cancelled() }}
      run: |
        python -m unittest discover -s ofrom_outils -p "test_*.py"
