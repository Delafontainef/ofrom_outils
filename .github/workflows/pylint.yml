name: Ruff

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Fetch the repository
      uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ">=3.12"
    - name: Install ruff
      run: |
        python -m pip install --upgrade pip
        pip install ruff
    - name: Run ruff
      run: | 
        ruff check
        echo "exit_code=$?" >> $GITHUB_OUTPUT
    - name: Check result
      run: | 
        ruff format --diff
        echo "exit_code=$?" >> $GITHUB_OUTPUT
